# 实习经历与工作经历，共用这一个文件，靠 kind 字段区分：
#   kind: internship  → 显示在「实习经历」板块
#   kind: work        → 显示在「工作经历」板块
# 每条必须有唯一 id，两个板块各自按 start 倒序排列。
#
# end 留空字符串 '' 表示「至今」。
# highlights 是可选的工作要点（中英各一份）；实习目前按只写公司与时间的要求，不填要点。
# 想给某条实习补上要点，照下面注释掉的示例加一个 highlights 段即可。

