- id: doc-qa-agent
  name: 多模态智能文档回答 Agent
  description:
    zh: 面向复杂文档问答的认知型 Agent。构建 MQE + HyDE 双路混合检索，并设计工作/情景/语义/感知四层记忆架构（Neo4j + Qdrant）；复杂问题 Top-3 召回准确率提升约 25%，幻觉率降低 40% 以上。
    en: A cognitive agent for complex document QA. Combines MQE and HyDE hybrid retrieval with a four-layer memory architecture (working, episodic, semantic, perceptual) on Neo4j and Qdrant. Top-3 recall on hard questions improved ~25%; hallucination rate cut by over 40%.
  tags:
    - Agent
    - RAG
    - LangChain
    - Neo4j
    - Qdrant
  year: 2026
  featured: true
  links: {}

- id: minionerec-opt
  name: MiniOneRec 生成式推荐框架优化
  description:
    zh: 以 Qwen3-1.5B 为基座、语义 ID 将推荐转为序列生成任务。引入 RQ-OPQ 分层残差量化缓解长尾表征坍缩，重构 GRPO 采样与多目标奖励；HitRate@10 +4.7%、长尾 Recall +8.3%、NDCG@10 +5.8%，训练显卡需求从 4×A100 降至 2 张。
    en: Generative recommendation on Amazon Review data with Qwen3-1.5B and semantic IDs. Added RQ-OPQ hierarchical residual quantisation to fix long-tail representation collapse and reworked GRPO sampling with a multi-objective reward. HitRate@10 +4.7%, long-tail Recall +8.3%, NDCG@10 +5.8%, and training GPUs reduced from 4×A100 to 2.
  tags:
    - Generative Recommendation
    - Qwen3
    - RQ-VAE
    - GRPO
    - LoRA
  year: 2026
  featured: true
  # 你账号下的 MiniOneRec 是官方仓库的 fork，不是这次优化工作的代码。
  # 如果优化代码确实推到了那里（或另开了仓库），把地址填上并取消注释。
