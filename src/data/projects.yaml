- id: dacg-ir
  name: DACG-IR
  description:
    zh: 论文《Degradation-Aware Adaptive Context Gating for Unified Image Restoration》的官方实现。通过多尺度退化提示动态调控注意力分布与频域调制，并设计空间-通道双门控融合，在 All-in-One、单任务、恶劣天气与复合退化基准上均取得 SOTA。
    en: Official implementation of "Degradation-Aware Adaptive Context Gating for Unified Image Restoration". Multi-scale degradation prompts modulate attention and frequency response, with a spatial-channel dual-gating fusion. Reaches SOTA on all-in-one, single-task, adverse-weather and composite-degradation benchmarks.
  tags:
    - Image Restoration
    - Low-Level Vision
    - PyTorch
  year: 2025
  stars: 7
  featured: true
  links:
    repo: https://github.com/HlHomes/DACG-IR-code
    paper: https://arxiv.org/abs/2605.01236

- id: qwen3-medical
  name: Qwen3-1.7B 中文医疗推理模型微调与量化
  description:
    zh: 医疗垂域的 SFT 微调、量化压缩与服务化全链路。对比全参 / LoRA / QLoRA，QLoRA 仅需 9GB 显存达 84.1% 准确率；AWQ 4-bit 将模型压到 0.85GB、显存 2.1GB、首字延迟 1.5s→0.4s；接入 vLLM 后吞吐提升 3 倍。
    en: End-to-end SFT, quantisation and serving for a Chinese medical reasoning model. QLoRA reaches 84.1% accuracy within 9GB VRAM; AWQ 4-bit compresses the model to 0.85GB with 2.1GB VRAM and cuts TTFT from 1.5s to 0.4s; vLLM triples throughput.
  tags:
    - LLM Fine-tuning
    - QLoRA
    - AWQ
    - vLLM
  year: 2026
  links: {}

